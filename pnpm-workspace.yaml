packages:
  - '.'
packageExtensions:
  # Registry-metadata mangler optional-flaggene fra pakkens package.json.
  '@navikt/browserslist-config-public@0.3.0':
    peerDependenciesMeta:
      astro:
        optional: true
      vite:
        optional: true
minimumReleaseAge: 4320 # minutter (3 dager)
minimumReleaseAgeExclude:
  - '@navikt/*'
  - '@nais/*'
ignoreScripts: true
blockExoticSubdeps: true
registries:
  '@navikt': https://npm.pkg.github.com
  '@nais': https://npm.pkg.github.com
allowBuilds:
  msw: true
  puppeteer: true
  unrs-resolver: true
