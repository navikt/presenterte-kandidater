name: Bygg og Deploy NextJS
on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v3.1
    with:
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24
      dev-vars-path: '.nais/dev-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'fjern-amplitude'
      a11y-command: 'pnpm a11y'
      playwright-command: 'pnpm test'
      playwright-snapshots: true
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      security-events: write
      pages: write
