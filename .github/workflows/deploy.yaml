name: Bygg og Deploy NextJS
on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v3.4
    with:
      cdn-upload: true
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24
      dev-vars-path: '.nais/dev-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'cdn'
      a11y-command: 'pnpm run test:a11y'
      playwright-command: >-
        pnpm exec playwright install --with-deps firefox webkit &&
        pnpm run test --grep-invert @a11y
      playwright-snapshots: true
      playwright-shards: 4
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      security-events: write
      pages: write
