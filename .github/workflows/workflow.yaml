name: Bygg og Deploy NextJS
on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v4
    with:
      cdn-upload: true
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:26
      dev-vars-path: '.nais/dev-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'ta-i-bruk-browserslist-config-public'
      playwright-command: pnpm run test
      playwright-shards: 4
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
